---
# Dynamic inventory will be populated by the playbook
# This file serves as a template and reference

all:
  children:
    web_servers:
      hosts:
        # Hosts will be added dynamically by the playbook
      vars:
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "~/.ssh/my-key-pair.pem"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
localhost:
  hosts:
    127.0.0.1:
      ansible_connection: local