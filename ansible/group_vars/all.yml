---
# AWS Configuration
aws_region: us-east-1
key_name: my-key-pair

# Instance Configuration
instance_type: t3.micro
ami_id: ami-0c02fb55956c7d316  # Amazon Linux 2 AMI (us-east-1)
instance_count: 1

# Network Configuration (leave empty to use default VPC)
vpc_id: ""
subnet_id: ""

# Security Group Configuration
security_group_name: web-server-sg

# Application Configuration
app_port: 3000
app_repo_url: "https://github.com/your-repo/cicd-pipeline-train-schedule-jenkins.git"

# Tags
environment: development
project_name: train-schedule-app

# SSH Configuration
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'